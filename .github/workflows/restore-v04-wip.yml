name: Restore v0.4 WIP on top of Phase 1
# Triggered by the GitHub-connected assistant.

on:
  push:
    branches: [wip/v0.4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current WIP branch
        uses: actions/checkout@v4
        with:
          ref: wip/v0.4
          fetch-depth: 0

      - name: Fetch Phase 1 branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin warstate-v0.3:refs/remotes/origin/warstate-v0.3

      - name: Extract WIP ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wip /tmp/phase1 /tmp/merged
          mkdir -p /tmp/wip /tmp/phase1 /tmp/merged

          unzip -q WarState_v0.4_WIP_source.zip -d /tmp/wip

          git archive origin/warstate-v0.3 | tar -x -C /tmp/phase1
          cp -a /tmp/phase1/. /tmp/merged/

          # Overlay the WIP source code on top of Phase 1.
          # Keep Phase 1's corrected project mapping, static-map generation,
          # CI helpers, documentation, and critical fixed tests.
          cp -a /tmp/wip/src/. /tmp/merged/src/
          cp -a /tmp/wip/tests/. /tmp/merged/tests/

          # Add WIP-only helper tools without replacing Phase 1 CI/build helpers.
          for f in tools/write_buildings.py tools/write_configs.py; do
            if [ -f "/tmp/wip/$f" ]; then
              mkdir -p "/tmp/merged/$(dirname "$f")"
              cp "/tmp/wip/$f" "/tmp/merged/$f"
            fi
          done

          if [ -d /tmp/wip/tools/rojo_probe ]; then
            rm -rf /tmp/merged/tools/rojo_probe
            cp -a /tmp/wip/tools/rojo_probe /tmp/merged/tools/rojo_probe
          fi

          # Preserve Phase 1 versions of files that must not regress.
          for f in             default.project.json             build_war_state.py             PROJECT.md             DEVELOPMENT_ROADMAP.md             AGENTS.md             plugin.project.json             tools/countries.py             tools/gen_static_map.py             tools/ci_unpack_rojo.py             tools/verify_build.py             tools/required_build_paths.txt             tools/rojo_build.py             tests/test_structure.py           ; do
            if [ -f "/tmp/phase1/$f" ]; then
              mkdir -p "/tmp/merged/$(dirname "$f")"
              cp "/tmp/phase1/$f" "/tmp/merged/$f"
            fi
          done

          # Merge GameConfig so WIP economy/utility fields are retained,
          # while Phase 1's map geometry/settings are preserved.
          python - <<'PY'
          import json
          from pathlib import Path

          p1 = Path("/tmp/phase1/src/ReplicatedStorage/Shared/Config/GameConfig.json")
          wip = Path("/tmp/wip/src/ReplicatedStorage/Shared/Config/GameConfig.json")
          out = Path("/tmp/merged/src/ReplicatedStorage/Shared/Config/GameConfig.json")

          if p1.exists() and wip.exists():
              a = json.loads(p1.read_text(encoding="utf-8"))
              b = json.loads(wip.read_text(encoding="utf-8"))
              merged = dict(a)
              for k, v in b.items():
                  if k != "Map":
                      merged[k] = v
              if "Map" in a:
                  merged["Map"] = a["Map"]
              out.write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          # Replace the current working tree with the merged tree.
          # Keep .git and .github.
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/merged/. .

          # Remove WIP/nested ZIP artifacts from the branch.
          rm -f WarState_v0.4_WIP_source.zip WarState_READY_BUILD.zip
          rm -rf dist build
          mkdir -p build dist

          echo "Merged WIP v0.4 on top of Phase 1."
          test -f default.project.json
          test -d src
          test -d tests

      - name: Commit merged source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Restore v0.4 WIP source on top of Phase 1 [skip ci]"
          git push origin HEAD:wip/v0.4
